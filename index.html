<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NNSN Test 3 — Multi-Component Bootstrap</title>
</head>
<body>
  <h2>Hello User</h2>
  <p>NNSN Test 3 — Multi-Component Bootstrap</p>

  <div>
    <strong>Protected Content JSON (1)</strong>
    <pre id="protectedContentOutput1">Loading...</pre>
  </div>

  <hr>

  <div>
    <strong>Structured Feedback JSON</strong>
    <pre id="feedbackOutput">Loading...</pre>
  </div>

  <hr>

  <div>
    <strong>Protected Video JSON</strong>
    <pre id="videoOutput">Loading...</pre>
    <button id="videoButton" style="display:none;" onclick="openProtectedVideo()">Open Study Team Video</button>
  </div>

  <hr>

  <div>
    <strong>Protected Content JSON (2)</strong>
    <pre id="protectedContentOutput2">Loading...</pre>
  </div>

  <script>
    const BASE_URL = 'https://script.google.com/macros/s/AKfycbxQzEpkpYWH4dIEj2rANbS1YPilHaKHgpuOSnOHTqWUmSKYYuGbuSugymc3KLfhCNO7/exec';
    const TEST_SESSION_ID = 'TEST_VALID_SID_123';
    const TEST_PID = 'TEST_PID_001';

    let protectedVideoUrl = '';

    function buildUrl(params) {
      const url = new URL(BASE_URL);
      Object.keys(params).forEach(function (key) {
        url.searchParams.set(key, params[key]);
      });
      return url.toString();
    }

    async function fetchJson(params, outputElementId) {
      const url = buildUrl(params);

      try {
        const res = await fetch(url);
        const text = await res.text();

        try {
          const data = JSON.parse(text);
          document.getElementById(outputElementId).textContent =
            JSON.stringify(data, null, 2);
          return data;
        } catch (jsonErr) {
          document.getElementById(outputElementId).textContent =
            'Non-JSON response:\n' + text;
          return null;
        }
      } catch (err) {
        document.getElementById(outputElementId).textContent =
          'ERROR: ' + err;
        return null;
      }
    }

    async function bootstrapPage() {
      await fetchJson(
        {
          action: 'getProtectedContent',
          sessionId: TEST_SESSION_ID
        },
        'protectedContentOutput1'
      );

      await fetchJson(
        {
          action: 'getStructuredFeedbackPrompt',
          sessionId: TEST_SESSION_ID,
          pid: TEST_PID
        },
        'feedbackOutput'
      );

      const videoData = await fetchJson(
        {
          action: 'getProtectedVideoUrl',
          sessionId: TEST_SESSION_ID
        },
        'videoOutput'
      );

      if (
        videoData &&
        videoData.ok &&
        videoData.video &&
        videoData.video.url
      ) {
        protectedVideoUrl = videoData.video.url;
        document.getElementById('videoButton').style.display = 'inline-block';
      } else {
        protectedVideoUrl = '';
        document.getElementById('videoButton').style.display = 'none';
      }

      await fetchJson(
        {
          action: 'getProtectedContent',
          sessionId: TEST_SESSION_ID
        },
        'protectedContentOutput2'
      );
    }

    function openProtectedVideo() {
      if (!protectedVideoUrl) return;
      window.open(protectedVideoUrl, '_blank');
    }

    window.addEventListener('load', function () {
      bootstrapPage();
    });
  </script>
</body>
</html>

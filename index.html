<!DOCTYPE html>
<html>
<body>
  <h2>NNSN Test 1 — Protected Content Gating</h2>

  <button onclick="testValid()">Test Valid SID</button>
  <button onclick="testMissing()">Test Missing SID</button>
  <button onclick="testFake()">Test Fake SID</button>

  <pre id="output"></pre>

  <script>
    const BASE_URL = 'YOUR_APPS_SCRIPT_EXEC_URL';

    async function callBackend(url) {
      try {
        const res = await fetch(url);
        const data = await res.json();
        document.getElementById('output').textContent =
          JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById('output').textContent =
          'ERROR: ' + err;
      }
    }

    function testValid() {
      callBackend(
        BASE_URL + '?action=getProtectedContent&sid=TEST_VALID_SID_123'
      );
    }

    function testMissing() {
      callBackend(
        BASE_URL + '?action=getProtectedContent'
      );
    }

    function testFake() {
      callBackend(
        BASE_URL + '?action=getProtectedContent&sid=FAKE123'
      );
    }
  </script>
</body>
</html>

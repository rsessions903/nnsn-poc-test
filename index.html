<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NNSN Test 2 — Structured Feedback</title>
</head>
<body>
  <h2>Hello User</h2>
  <p>NNSN Test 2 — Structured Feedback mixed-method test</p>

  <div>
    <strong>Prompt Request URL</strong>
    <pre id="promptUrlBox"></pre>
  </div>

  <div>
    <strong>Prompt Response JSON</strong>
    <pre id="promptOutput">Loading prompt...</pre>
  </div>

  <hr>

  <div>
    <strong>Submit Response</strong><br><br>
    <button onclick="submitLikert(1)">1</button>
    <button onclick="submitLikert(2)">2</button>
    <button onclick="submitLikert(3)">3</button>
    <button onclick="submitLikert(4)">4</button>
    <button onclick="submitLikert(5)">5</button>
  </div>

  <div style="margin-top: 16px;">
    <strong>Submit Response JSON</strong>
    <pre id="submitOutput">No submission yet.</pre>
  </div>

  <script>
    const BASE_URL = 'https://script.google.com/macros/s/AKfycbxQzEpkpYWH4dIEj2rANbS1YPilHaKHgpuOSnOHTqWUmSKYYuGbuSugymc3KLfhCNO7/exec';
    const TEST_SESSION_ID = 'TEST_VALID_SID_123';
    const TEST_PID = 'TEST_PID_001';

    let currentPrompt = null;

    function buildUrl(params) {
      const url = new URL(BASE_URL);
      Object.keys(params).forEach(function (key) {
        url.searchParams.set(key, params[key]);
      });
      return url.toString();
    }

    async function loadPrompt() {
      const url = buildUrl({
        action: 'getStructuredFeedbackPrompt',
        sessionId: TEST_SESSION_ID,
        pid: TEST_PID
      });

      document.getElementById('promptUrlBox').textContent = url;

      try {
        const res = await fetch(url);
        const text = await res.text();

        try {
          const data = JSON.parse(text);
          document.getElementById('promptOutput').textContent =
            JSON.stringify(data, null, 2);

          if (data && data.ok && data.prompt) {
            currentPrompt = data.prompt;
          } else {
            currentPrompt = null;
          }
        } catch (jsonErr) {
          document.getElementById('promptOutput').textContent =
            'Non-JSON response:\n' + text;
          currentPrompt = null;
        }
      } catch (err) {
        document.getElementById('promptOutput').textContent =
          'ERROR: ' + err;
        currentPrompt = null;
      }
    }

    async function submitLikert(likertValue) {
      if (!currentPrompt || !currentPrompt.promptId) {
        document.getElementById('submitOutput').textContent =
          'ERROR: No active prompt loaded.';
        return;
      }
    
      const formData = new URLSearchParams();
      formData.set('action', 'submitStructuredFeedbackResponse');
      formData.set('sessionId', TEST_SESSION_ID);
      formData.set('pid', TEST_PID);
      formData.set('promptId', currentPrompt.promptId);
      formData.set('likertValue', String(likertValue));
    
      try {
        const res = await fetch(BASE_URL, {
          method: 'POST',
          body: formData
        });
    
        const text = await res.text();
    
        try {
          const data = JSON.parse(text);
          document.getElementById('submitOutput').textContent =
            JSON.stringify(data, null, 2);
        } catch (jsonErr) {
          document.getElementById('submitOutput').textContent =
            'Non-JSON response:\n' + text;
        }
      } catch (err) {
        document.getElementById('submitOutput').textContent =
          'ERROR: ' + err;
      }
    }

    
    window.addEventListener('load', function () {
      loadPrompt();
    });
  </script>
</body>
</html>

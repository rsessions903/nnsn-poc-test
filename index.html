<!DOCTYPE html>
<html>
<body>
  <h2>NNSN Test 1 — Protected Content Gating</h2>

  <button onclick="testValid()">Test Valid SID</button>
  <button onclick="testMissing()">Test Missing SID</button>
  <button onclick="testFake()">Test Fake SID</button>

  <h3>URL</h3>
  <pre id="urlbox"></pre>

  <h3>Output</h3>
  <pre id="output"></pre>

  <script>
    const BASE_URL = 'https://script.google.com/macros/s/AKfycbxQzEpkpYWH4dIEj2rANbS1YPilHaKHgpuOSnOHTqWUmSKYYuGbuSugymc3KLfhCNO7/exec';

    function buildUrl(params) {
      const url = new URL(BASE_URL);
      Object.keys(params).forEach(key => {
        url.searchParams.set(key, params[key]);
      });
      return url.toString();
    }

    async function callBackend(params) {
      const url = buildUrl(params);
      document.getElementById('urlbox').textContent = url;

      try {
        const res = await fetch(url);
        const text = await res.text();

        try {
          const data = JSON.parse(text);
          document.getElementById('output').textContent =
            JSON.stringify(data, null, 2);
        } catch (jsonErr) {
          document.getElementById('output').textContent =
            'Non-JSON response:\n' + text;
        }
      } catch (err) {
        document.getElementById('output').textContent =
          'ERROR: ' + err;
      }
    }

    function testValid() {
      callBackend({
        action: 'getProtectedContent',
        sid: 'TEST_VALID_SID_123'
      });
    }

    function testMissing() {
      callBackend({
        action: 'getProtectedContent'
      });
    }

    function testFake() {
      callBackend({
        action: 'getProtectedContent',
        sid: 'FAKE123'
      });
    }
  </script>
</body>
</html>
